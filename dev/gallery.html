<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon gallery (dev)</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  body { padding: 24px; background: #eee; }
  h2 { margin: 32px 0 12px; font: 800 20px/1 system-ui, sans-serif; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .g figure { margin: 0; background: #fff; border-radius: 12px; overflow: hidden; }
  .g .tile { height: 130px; border-radius: 0; }
  .g .tile .ico { width: 96px; height: 96px; }
  .g figcaption { font: 600 11px/1.3 ui-monospace, monospace; padding: 6px 8px; color: #333; }
  .g figcaption b { display: block; font: 700 12px/1.3 system-ui, sans-serif; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../data/_registry.js"></script>
<script src="../data/car.js"></script>
<script src="../data/laundry.js"></script>
<script src="../data/kitchen.js"></script>
<script src="../data/tech.js"></script>
<script>
  var out = document.getElementById("out");
  var only = new URLSearchParams(location.search).get("cat");
  WTF.categories.forEach(function (c) {
    if (only && only !== c.id) return;
    var list = WTF.icons.filter(function (i) { return i.category === c.id; });
    if (!list.length) return;
    var h = document.createElement("h2");
    h.textContent = c.name + " (" + list.length + ")";
    out.appendChild(h);
    var g = document.createElement("div");
    g.className = "g";
    g.innerHTML = list.map(function (i) {
      return '<figure><div class="tile tile--' + c.tile + (i.color ? " is-" + i.color : "") + '">' + WTF.svg(i) +
        '</div><figcaption><b>' + i.name + '</b>' + i.id + '</figcaption></figure>';
    }).join("");
    out.appendChild(g);
  });
</script>
</body>
</html>
